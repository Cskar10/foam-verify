# Square duct, fully developed laminar flow, Re = 100. See generate.py and README.md.
name = "square-duct"
dim = 2            # the cross-section is refined; the one cyclic cell along the flow is not
formal_order = 2
refined = "mesh"
grid_sequence = "structured"   # every level refines the same block mesh systematically

[[levels]]
name = "160x160"
path = "n160"

[[levels]]
name = "80x80"
path = "n80"

[[levels]]
name = "40x40"
path = "n40"

[[levels]]
name = "20x20"
path = "n20"

# Darcy f Re = 8 tau_w D_h / (nu Ubar) = 800 tau_w with D_h = 1, nu = 0.01, Ubar = 1. With
# this function object's sign convention the x component is negative for flow along +x, hence
# the minus sign.
[[qoi]]
name = "fRe"
file = "postProcessing/wallStress/*/surfaceFieldValue.dat"
column = "areaAverage(wallShearStress)"
component = "x"
reduction = "last"
scale = -800.0

# The exact f Re: the series solution for the square duct (Shah and London 1978), as
# foam_verify.exact.rectangular_duct_fre(1.0) computes it to double precision;
# tests/test_studies.py checks the two agree. An exact reference makes the comparison a
# code-verification check: does U bound the actual error?
[[reference]]
qoi = "fRe"
kind = "exact"
label = "Shah and London (1978)"
value = 56.90830753911475
source = "the series solution for the square duct (Shah and London 1978), foam_verify.exact.rectangular_duct_fre(1.0)"
