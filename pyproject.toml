[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foam-verify"
version = "0.0.1"
description = "Read-only verification of OpenFOAM results: grid convergence index, iterative convergence, settings consistency."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christos Skarakis" }]
keywords = ["cfd", "openfoam", "verification", "grid-convergence", "gci", "richardson-extrapolation"]
dependencies = []

[project.scripts]
foam-verify = "foam_verify.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/foam_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
