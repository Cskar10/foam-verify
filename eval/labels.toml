key = "duct-4"
source = "studies/duct"
build = "the committed study, all four levels"
new_runs = []
qoi = "fRe"
verdict = "trustworthy"
reasons = []
value = 56.8997
uncertainty = 0.0108
exact = 56.90830753911475
why = """
Every check holds (studies/duct/report.md): monotonic convergence at p = 1.995, asymptotic-range
ratio 1.000, the coarser triplet monotonic too, the QoI settled to 1e-12 on every level, the
levels differing only in the mesh. The exact value lies in the band 56.8890 to 56.9105.
"""

