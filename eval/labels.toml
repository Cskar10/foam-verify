[[bundle]]
id = "b12"
key = "pitz-residuals"
source = "studies/pitzDaily"
build = "all four levels run again as in studies/pitzDaily, with the tutorial's residualControl restored (p 1e-2; U, k and epsilon 1e-3) and the pressure drop written every iteration"
new_runs = ["139k", "62k", "28k", "12k"]
qoi = "dp"
verdict = "not_trustworthy"
reasons = ["iterative", "grid_convergence"]
why = """
Each run stops when its residuals fall below the tutorial's residualControl, after about 280 to
1430 iterations from 12k to 139k (predicted from the committed runs' residuals), and the log says
the run converged. dp is still changing there by 7 to 23% of its value over the last 50
iterations, and run to 8000 iterations the same levels settle up to 15% away (studies/pitzDaily).
Even run fully, the case does not converge with the mesh.
"""
